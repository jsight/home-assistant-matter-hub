version: "0.0.8-1"
image: ghcr.io/jsight/hamh-closure-branch-test
slug: hamh-closure-test
name: Home Assistant Matter Hub (Closure Branch Test)
description: Test build from the Matter Closure feature branch. Stop other Matter Hub instances before starting this app.
url: https://github.com/jsight/home-assistant-matter-hub/tree/feature/matter-closure-garage-cover
panel_icon: mdi:hub
panel_title: Matter Hub Test
homeassistant: 2024.1.0
homeassistant_api: true
host_network: true
init: false
arch:
  - aarch64
  - amd64
ingress: true
ingress_port: 0
map:
  - addon_config:rw
options:
  app_log_level: info
  protocol_log_level: info
  disable_log_colors: false
  mdns_network_interface: ""
  mdns_strip_global_ipv6: false
  heap_size_mb: 0
schema:
  app_log_level: list(silly|debug|info|notice|warn|error|fatal)
  protocol_log_level: list(silly|debug|info|notice|warn|error|fatal)
  disable_log_colors: bool
  mdns_network_interface: "str?"
  mdns_strip_global_ipv6: bool
  heap_size_mb: int(0,8192)
