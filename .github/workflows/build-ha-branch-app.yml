name: Build HA branch test app

on:
  push:
    branches:
      - feature/matter-closure-garage-cover
    paths-ignore:
      - "ha-app/**"
      - "*.md"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: hamh-closure-branch-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Choose image version
        id: version
        run: echo "value=0.0.${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package application
        run: |
          pnpm run build
          pnpm --filter home-assistant-matter-hub run bundle
        env:
          BASE_URL: /home-assistant-matter-hub
          APP_VERSION: ${{ steps.version.outputs.value }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish test image
        uses: docker/build-push-action@v7
        with:
          context: apps/home-assistant-matter-hub
          file: apps/home-assistant-matter-hub/addon.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NODE_VERSION=24
            PACKAGE_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/jsight/hamh-closure-branch-test:${{ steps.version.outputs.value }}
            ghcr.io/jsight/hamh-closure-branch-test:sha-${{ github.sha }}

      - name: Point the HA app manifest at this image
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.value }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin "$BRANCH_NAME"
          git checkout --detach "origin/$BRANCH_NAME"
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const manifestPath = "ha-app/hamh-closure-test/config.yaml";
          const current = fs.readFileSync(manifestPath, "utf8");
          const updated = current.replace(/^version:.*$/m, `version: "${process.env.IMAGE_VERSION}"`);
          if (updated === current) {
            throw new Error(`Could not update the version in ${manifestPath}`);
          }
          fs.writeFileSync(manifestPath, updated);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ha-app/hamh-closure-test/config.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update HA test app image to $IMAGE_VERSION"
            git push origin "HEAD:$BRANCH_NAME"
          fi
